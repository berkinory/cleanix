name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Verify version and architecture
        shell: bash
        run: |
          package=$(cargo pkgid)
          version=${package##*#}
          version=${version##*@}
          test "$GITHUB_REF_NAME" = "v$version"
          rustc -vV | grep -Fx "host: $TARGET"
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          test "$(target/release/cleanix --version)" = "cleanix ${GITHUB_REF_NAME#v}"
          mkdir dist package
          cp target/release/cleanix LICENSE package/
          tar -czf "dist/cleanix-$TARGET.tar.gz" -C package cleanix LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: cleanix-${{ matrix.target }}
          path: dist/*.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cleanix-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp install.sh dist/install.sh
          (cd dist && sha256sum cleanix-*.tar.gz install.sh > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Adds `cleanix update` and Homebrew formula distribution.

          - `cleanix update` checks the latest stable release and updates standalone installations in place after SHA-256 and version verification.
          - Homebrew installations update through `brew update` and `brew upgrade cleanix`; the updater never overwrites a managed keg.
          - Install with `brew install berkinory/brew/cleanix`. The tap formula is refreshed automatically after publication using verified release checksums.
          - macOS app uninstall and existing macOS/Linux cleanup remain available.

          Install the binary for your platform, with SHA-256 verification:

          ```sh
          curl -fsSL https://github.com/berkinory/cleanix/releases/download/vRELEASE_VERSION/install.sh -o /tmp/cleanix-install.sh
          sh /tmp/cleanix-install.sh RELEASE_VERSION
          ```

          Defaults to `~/.local/bin`; override with `CLEANIX_INSTALL_DIR`.
          Requires macOS 11+ or Linux with glibc 2.35+. Linux administrator actions require polkit and an authentication agent.
          NOTES
          sed -i "s/RELEASE_VERSION/${GITHUB_REF_NAME#v}/g" "$RUNNER_TEMP/release-notes.txt"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "cleanix ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.txt"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
  homebrew:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: cleanix-homebrew
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Set HOMEBREW_TAP_TOKEN with Contents write access to berkinory/homebrew-brew." >&2; exit 1; }
          python3 scripts/update-homebrew.py "$GITHUB_REF_NAME" --publish
