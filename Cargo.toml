[package]
name = "cleanix"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A quiet, native macOS and Linux developer cleaner"

[dependencies]
anyhow = "1"
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"
libc = "0.2"
signal-hook = "0.3"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
